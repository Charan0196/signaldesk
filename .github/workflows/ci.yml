name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # The suite is fully offline — no Hindsight key needed in CI.
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t signaldesk:ci .
      - name: Smoke test container
        run: |
          docker run -d --name sd -p 8420:8420 signaldesk:ci
          # Startup calls out to Hindsight, so only assert the process serves
          # its own shell without crashing on import.
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8420/; then
              echo "container serving on :8420"; docker rm -f sd; exit 0
            fi
            sleep 3
          done
          echo "container failed to serve"; docker logs sd; docker rm -f sd; exit 1
