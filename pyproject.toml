[project]
name = "signaldesk"
version = "0.1.0"
description = "Churn early-warning and save-play memory for B2B customer success teams, built on Hindsight."
requires-python = ">=3.11"
dependencies = [
    "hindsight-client>=0.10.1",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
signaldesk = "signaldesk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signaldesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
